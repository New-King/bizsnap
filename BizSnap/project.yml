name: BizSnap
options:
  bundleIdPrefix: com.bizsnap
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: VA9NZV3TUY
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  BizSnap:
    type: application
    platform: iOS
    sources:
      - path: BizSnap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.newking.bizsnap
        PRODUCT_NAME: BizSnap
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_FILE: BizSnap/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      gatherCoverageData: false
      testTargets: []
    info:
      path: BizSnap/Info.plist
      properties:
        CFBundleDisplayName: BizSnap
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSContactsUsageDescription: 用于把确认后的联系人写入系统通讯录，并在查人时展示是否已在通讯录里。
        NSCalendarsFullAccessUsageDescription: 用于把确认后的会议写入系统日历。
        NSCalendarsWriteOnlyAccessUsageDescription: 用于把确认后的会议写入系统日历。
        NSPhotoLibraryUsageDescription: 用于选择商务聊天截图。
        NSCameraUsageDescription: 用于拍摄商务聊天截图。
        NSLocalNetworkUsageDescription: 用于连接同一局域网内运行的 BizSnap 本地服务。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            127.0.0.1:
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
